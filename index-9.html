<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Jejak — Monitoring Sales GPS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* ============ DESIGN TOKENS ============
   Jejak = "footprint / trace". Enterprise ops-monitoring tool.
   Palette: deep navy (authority), sky blue (motion/GPS), slate grays (structure),
   status colors are the real signal system of this product.
   Type: system sans for UI (fast, safe, no external font load), tabular mono
   for all data/telemetry (coordinates, distances, timestamps) — the app's
   one consistent "signature": anything that is a measurement reads in mono.
   Signature motif: dotted "footstep trail" route line + breathing GPS pulse dot.
*/
:root{
  --navy-900:#0B1F3A;
  --navy-800:#122A4D;
  --navy-700:#1A3A66;
  --blue-600:#2563EB;
  --blue-500:#3B82F6;
  --blue-100:#E8F1FF;
  --slate-50:#F6F8FB;
  --slate-100:#EEF2F7;
  --slate-200:#E2E8F0;
  --slate-300:#CBD5E1;
  --slate-500:#64748B;
  --slate-600:#475569;
  --slate-900:#0F172A;
  --white:#FFFFFF;
  --ok-600:#16A34A;   --ok-100:#DCFCE7;
  --off-500:#94A3B8;  --off-100:#F1F5F9;
  --warn-600:#CA8A04; --warn-100:#FEF9C3;
  --err-600:#DC2626;  --err-100:#FEE2E2;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 4px 16px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.06);
  --shadow-lg:0 12px 32px rgba(15,23,42,.14);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font-ui); background:var(--slate-50); color:var(--slate-900);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--blue-100);}
:focus-visible{outline:2px solid var(--blue-500); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ---------- Layout shell ---------- */
#app{min-height:100%;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--navy-900); color:#DCE6F5;
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px 8px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--blue-500),var(--navy-700));
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.brand-text{line-height:1.1;}
.brand-text b{display:block; font-size:15px; letter-spacing:.2px; color:#fff;}
.brand-text span{display:block; font-size:10.5px; color:#8FA6C9; letter-spacing:.4px; margin-top:2px;}
.nav-group{margin-bottom:4px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:#B7C6E0; font-size:13.5px; font-weight:500; margin-bottom:2px; text-decoration:none;
  border:none; background:transparent; width:100%; text-align:left; transition:background .12s, color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--blue-600); color:#fff;}
.nav-item .ic{width:18px; text-align:center; flex-shrink:0; font-size:15px;}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px;}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--blue-500); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0;
}
.user-chip .u-name{font-size:13px; font-weight:600; color:#fff;}
.user-chip .u-role{font-size:11px; color:#8FA6C9;}
.logout-btn{
  width:100%; margin-top:8px; padding:8px; border-radius:9px; border:1px solid rgba(255,255,255,.12);
  background:transparent; color:#B7C6E0; font-size:12.5px; font-weight:600;
}
.logout-btn:hover{background:rgba(255,255,255,.06); color:#fff;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:none; align-items:center; justify-content:space-between; padding:12px 16px;
  background:var(--white); border-bottom:1px solid var(--slate-200); position:sticky; top:0; z-index:20;
}
.content{flex:1; padding:26px 30px 90px 30px; max-width:1280px; width:100%; margin:0 auto;}
.page-head{margin-bottom:20px;}
.page-eyebrow{font-size:11.5px; font-weight:700; color:var(--blue-600); letter-spacing:.6px; text-transform:uppercase; margin:0 0 4px 0;}
.page-title{font-size:22px; font-weight:800; margin:0; color:var(--navy-900); letter-spacing:-.2px;}
.page-sub{font-size:13.5px; color:var(--slate-500); margin:5px 0 0 0;}

.bottom-nav{display:none;}

/* ---------- Cards / stats ---------- */
.card{background:var(--white); border:1px solid var(--slate-200); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.grid{display:grid; gap:16px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.stat-card{padding:18px 18px 16px 18px; position:relative; overflow:hidden;}
.stat-card .s-label{font-size:11.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--slate-500);}
.stat-card .s-value{font-family:var(--font-mono); font-size:28px; font-weight:700; color:var(--navy-900); margin-top:8px; letter-spacing:-.5px;}
.stat-card .s-value small{font-size:14px; font-weight:600; color:var(--slate-500); margin-left:2px;}
.stat-card .s-icon{position:absolute; right:14px; top:14px; font-size:20px; opacity:.5;}
.stat-card.accent-blue{border-top:3px solid var(--blue-500);}
.stat-card.accent-ok{border-top:3px solid var(--ok-600);}
.stat-card.accent-off{border-top:3px solid var(--off-500);}
.stat-card.accent-warn{border-top:3px solid var(--warn-600);}

/* ---------- Badges / status ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700; letter-spacing:.2px;}
.badge .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.badge-ok{background:var(--ok-100); color:#15803D;} .badge-ok .dot{background:var(--ok-600);}
.badge-off{background:var(--off-100); color:#475569;} .badge-off .dot{background:var(--off-500);}
.badge-warn{background:var(--warn-100); color:#854D0E;} .badge-warn .dot{background:var(--warn-600);}
.badge-err{background:var(--err-100); color:#B91C1C;} .badge-err .dot{background:var(--err-600);}
.pulse .dot{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.45);} 50%{box-shadow:0 0 0 5px rgba(22,163,74,0);}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:700; border:1px solid transparent; transition:transform .05s, filter .12s, background .12s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--blue-600); color:#fff;} .btn-primary:hover{filter:brightness(1.06);}
.btn-danger{background:var(--err-600); color:#fff;} .btn-danger:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--white); color:var(--navy-900); border-color:var(--slate-200);} .btn-ghost:hover{background:var(--slate-50);}
.btn-outline-danger{background:#fff; color:var(--err-600); border-color:#F3C6C6;}
.btn-lg{padding:16px 20px; font-size:15px; border-radius:14px; width:100%;}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn[disabled]{opacity:.55; cursor:not-allowed;}
.btn-block-work{
  width:100%; padding:22px; border-radius:18px; font-size:16px; font-weight:800; letter-spacing:.3px;
  display:flex; align-items:center; justify-content:center; gap:10px; border:none; color:#fff; box-shadow:var(--shadow-md);
}
.btn-start-work{background:linear-gradient(135deg,#16A34A,#15803D);}
.btn-stop-work{background:linear-gradient(135deg,#DC2626,#B91C1C);}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--slate-600); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--slate-300); font-size:13.5px; background:#fff; color:var(--slate-900);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue-500);}
.field textarea{resize:vertical; min-height:70px;}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:12px; color:var(--slate-500); font-weight:700;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--slate-200);}
table{width:100%; border-collapse:collapse; background:#fff; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--slate-500); font-weight:700; padding:12px 14px; background:var(--slate-50); border-bottom:1px solid var(--slate-200); white-space:nowrap;}
td{padding:13px 14px; border-bottom:1px solid var(--slate-100); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:var(--slate-50);}

/* ---------- Toast ---------- */
#toast-host{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{
  background:var(--navy-900); color:#fff; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastIn .18s ease-out;
}
.toast.ok{background:#14532D;} .toast.err{background:#7F1D1D;} .toast.warn{background:#713F12;}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(11,31,58,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .15s;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:#fff; border-radius:18px; width:100%; max-width:440px; box-shadow:var(--shadow-lg); overflow:hidden; animation:modalIn .16s;}
@keyframes modalIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-head{padding:18px 20px 4px 20px;}
.modal-head h3{margin:0; font-size:16.5px; font-weight:800; color:var(--navy-900);}
.modal-body{padding:14px 20px 4px 20px; font-size:13.5px; color:var(--slate-600); line-height:1.5;}
.modal-foot{padding:16px 20px 20px 20px; display:flex; gap:10px; justify-content:flex-end;}
.modal-form{padding:14px 20px 4px 20px; max-height:60vh; overflow-y:auto;}

/* ---------- Misc ---------- */
.empty-state{padding:44px 20px; text-align:center; color:var(--slate-500);}
.empty-state .e-ic{font-size:30px; margin-bottom:8px;}
.empty-state .e-title{font-weight:700; color:var(--slate-600); font-size:14px;}
.empty-state .e-sub{font-size:12.5px; margin-top:4px;}
.skeleton{background:linear-gradient(90deg,var(--slate-100) 25%,var(--slate-200) 37%,var(--slate-100) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:10px;}
@keyframes sk{0%{background-position:100% 0;} 100%{background-position:0 0;}}
.divider{height:1px; background:var(--slate-200); margin:16px 0;}
.hstack{display:flex; align-items:center; gap:10px;}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.search-input{position:relative;}
.search-input input{padding-left:34px;}
.search-input .si-ic{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--slate-500); font-size:13px;}
.chip-filter{display:flex; gap:8px; flex-wrap:wrap;}
.chip-filter button{padding:7px 13px; border-radius:100px; border:1px solid var(--slate-300); background:#fff; font-size:12.5px; font-weight:600; color:var(--slate-600);}
.chip-filter button.active{background:var(--navy-900); border-color:var(--navy-900); color:#fff;}
.leaflet-map{width:100%; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--slate-200);}
.map-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--slate-600); margin-top:10px;}
.map-legend span{display:inline-flex; align-items:center; gap:5px;}
.map-legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}
.timeline{position:relative; padding-left:22px;}
.timeline::before{content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--slate-200);}
.t-item{position:relative; padding-bottom:18px;}
.t-item::before{content:""; position:absolute; left:-22px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--blue-500); border:2px solid #fff; box-shadow:0 0 0 2px var(--blue-100);}
.t-time{font-family:var(--font-mono); font-size:11.5px; color:var(--slate-500); font-weight:700;}
.t-label{font-size:13.5px; font-weight:600; color:var(--slate-900); margin-top:1px;}
.visit-card{padding:14px 16px; border:1px solid var(--slate-200); border-radius:14px; margin-bottom:10px; background:#fff; cursor:pointer; transition:border-color .12s;}
.visit-card:hover{border-color:var(--blue-500);}
.visit-card .v-name{font-weight:700; font-size:14px; color:var(--navy-900);}
.visit-card .v-meta{font-size:12px; color:var(--slate-500); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap;}
.visit-card .v-note{font-size:12.5px; color:var(--slate-600); margin-top:6px;}
.gps-banner{padding:14px 16px; border-radius:14px; display:flex; gap:12px; align-items:flex-start; font-size:13px;}
.gps-banner.ok{background:var(--ok-100); color:#14532D;}
.gps-banner.warn{background:var(--warn-100); color:#713F12;}
.gps-banner.err{background:var(--err-100); color:#7F1D1D;}
.gps-banner b{display:block; font-size:13.5px; margin-bottom:2px;}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 20%, #16305A, var(--navy-900) 60%); padding:20px;}
.login-card{width:100%; max-width:380px; background:#fff; border-radius:22px; box-shadow:var(--shadow-lg); padding:32px 28px 28px 28px;}
.login-logo{display:flex; flex-direction:column; align-items:center; margin-bottom:22px;}
.login-logo .brand-mark{width:52px; height:52px; border-radius:16px; font-size:24px; margin-bottom:10px;}
.login-logo h1{font-size:20px; font-weight:800; margin:0; color:var(--navy-900);}
.login-logo p{font-size:12px; color:var(--slate-500); margin:4px 0 0 0;}
.demo-accounts{margin-top:18px; padding:12px; background:var(--slate-50); border-radius:12px; font-size:11.5px; color:var(--slate-600);}
.demo-accounts b{color:var(--navy-900);}
.demo-accounts button{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--slate-200); border-radius:8px; padding:7px 10px; margin-top:6px; font-size:11.5px; font-family:var(--font-mono);}
.demo-accounts button:hover{border-color:var(--blue-500);}
.err-msg{background:var(--err-100); color:#B91C1C; padding:9px 12px; border-radius:9px; font-size:12.5px; font-weight:600; margin-bottom:12px;}

@media (max-width: 880px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .content{padding:16px 14px 90px 14px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--slate-200);
    z-index:50; padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px; box-shadow:0 -4px 16px rgba(15,23,42,.06);
  }
  .bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:none; background:none; color:var(--slate-500); font-size:10px; font-weight:700;}
  .bn-item .ic{font-size:18px;}
  .bn-item.active{color:var(--blue-600);}
}
</style>
</head>
<body>
<div id="toast-host"></div>
<div id="app"></div>

<script>
/* =====================================================================
   JEJAK — MONITORING SALES GPS
   Single-file demo build. All data lives in the MOCK_DB / STATE objects
   below. The `api` object is the seam meant to be swapped for real HTTP
   calls to a Node/Express + MySQL backend later — every screen only
   ever talks to `api.*`, never to MOCK_DB directly.
   ===================================================================== */

/* ---------------------------- UTILITIES ---------------------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9);
const nowISO = () => new Date().toISOString();
const fmtTime = (d) => d ? new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : '—';
const fmtDateShort = (d) => d ? new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short'}) : '—';
const fmtDuration = (ms) => {
  if(ms==null || ms<0) return '—';
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return `${h}j ${m}m`;
};
function haversine(a,b){
  if(!a||!b) return 0;
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function routeDistanceKm(points){
  let d=0; for(let i=1;i<points.length;i++) d+=haversine(points[i-1],points[i]);
  return d;
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Kompres foto (dari kamera/galeri) jadi dataURL kecil sebelum disimpan ke
// database — biar tidak kebesaran (Firestore batasi ukuran per dokumen).
function compressImageFile(file, maxDim=900, quality=0.7){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.onload = ()=>{
      let {width:w, height:h} = img;
      if(w>maxDim || h>maxDim){ const r = Math.min(maxDim/w, maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    }; img.onerror = reject; img.src = e.target.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Hash password pakai SHA-256 bawaan browser (Web Crypto API) — supaya
// password tidak tersimpan polos (plaintext) di database. Hash selalu 64
// karakter heksadesimal, jadi kita bisa bedakan dari password lama yang
// belum sempat di-hash (lihat checkPassword di bawah).
async function hashPassword(plain){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function looksHashed(v){ return typeof v==='string' && /^[0-9a-f]{64}$/.test(v); }
// Cocokkan password login terhadap yang tersimpan. Mendukung akun lama yang
// passwordnya masih plaintext (dibuat sebelum fitur hashing ini ada) —
// begitu berhasil login, otomatis di-upgrade jadi ter-hash (lihat api.login).
async function checkPassword(inputPlain, stored){
  if(looksHashed(stored)) return (await hashPassword(inputPlain)) === stored;
  return inputPlain === stored; // akun lama, belum sempat di-hash
}
function toast(msg, type='ok', ms=3200){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type==='ok' ? '✓' : type==='err' ? '✕' : '⚠';
  el.innerHTML = `<span>${ic}</span><span>${escapeHtml(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, ms);
}

let firebaseReady = Promise.resolve();

if(USE_FIREBASE){
  firebase.initializeApp(FIREBASE_CONFIG);
  const kv = firebase.firestore().collection('kv_store');
  // Absen anonim ke Firebase supaya Firestore bisa menolak siapapun yang
  // mengakses data langsung dari luar aplikasi ini (lihat security rules).
  // Ini TIDAK terlihat oleh pengguna dan tidak menggantikan sistem login

  firebaseReady = firebase.auth().signInAnonymously().catch(e=>{

  });
  dbGet = async function(key){
    try{ const doc = await kv.doc(key).get(); return doc.exists ? doc.data().value : null; }
    catch(e){ console.error('Firestore get error', e); return null; }
  };
  dbSet = async function(key, value){
    try{ await kv.doc(key).set({value, updatedAt: Date.now()}); }
    catch(e){ console.error('Firestore set error', e); }
  };
  console.info('Jejak: memakai Firestore sebagai database.');
} else {
  // Fallback: window.storage (kalau dijalankan lewat Claude) atau
  // localStorage (kalau file dibuka langsung dari HP/PC, browser biasa).
  // Data tetap tersimpan permanen di browser itu, tidak hilang saat refresh —
  // hanya belum bisa diakses dari perangkat lain. Isi FIREBASE_CONFIG di atas
  // untuk penyimpanan yang bisa diakses dari mana saja.
  const hasWindowStorage = typeof window.storage !== 'undefined';
  dbGet = async function(key){
    try{
      if(hasWindowStorage){ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
      const raw = localStorage.getItem('jejak:'+key); return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  };
  dbSet = async function(key, value){
    try{
      if(hasWindowStorage){ await window.storage.set(key, JSON.stringify(value), true); }
      else{ localStorage.setItem('jejak:'+key, JSON.stringify(value)); }
    }catch(e){ console.error('Storage error', e); }
  };
  console.info('Jejak: memakai '+(hasWindowStorage?'penyimpanan Claude':'localStorage')+' sebagai database.');
}

const CENTER = {lat:-6.9175, lng:107.6191}; // Bandung
function jitter(base, km){ // random point near base
  const dLat = (Math.random()-0.5) * (km/111);
  const dLng = (Math.random()-0.5) * (km/(111*Math.cos(base.lat*Math.PI/180)));
  return {lat:+(base.lat+dLat).toFixed(6), lng:+(base.lng+dLng).toFixed(6)};
}
function buildRoute(start, n, spreadKm){
  const pts=[start];
  let cur=start;
  for(let i=0;i<n;i++){ cur = jitter(cur, spreadKm); pts.push(cur); }
  return pts;
}

/* ---------------------------- API SEAM (mock, swappable) ----------------------------
   Every function returns a Promise, mirroring a real fetch() call, so this
   object is the only thing that needs to change to wire up a real backend
   (see endpoints in the project brief: /api/auth/login, /api/gps/location, etc). */
const api = {
  login: async (username, password) => {
    await delay(450);
    const u = MOCK_DB.users.find(x=>x.username===username);
    if(!u || !(await checkPassword(password, u.password))) throw new Error('Username atau password salah.');
    if(u.status!=='active') throw new Error('Akun ini dinonaktifkan. Hubungi admin.');
    if(!looksHashed(u.password)){
      // Migrasi diam-diam: akun lama yang passwordnya masih plaintext,
      // begitu berhasil login sekali, langsung di-upgrade jadi ter-hash.
      u.password = await hashPassword(password);
      await persistKey('users');
    }
    return {...u};
  },

  startWork: async (salesId, pos) => {
    const session = {id:uid('sess'), salesId, checkIn:nowISO(), checkOut:null, status:'working', totalDistance:0, date:new Date().toISOString().slice(0,10)};
    MOCK_DB.workSessions.push(session);
    if(pos) MOCK_DB.gpsTracking.push({id:uid('gps'), sessionId:session.id, salesId, latitude:pos.lat, longitude:pos.lng, accuracy:pos.accuracy||15, timestamp:nowISO()});
    await persistKey('workSessions'); await persistKey('gpsTracking');
    await delay(300);
    return session;
  },

  stopWork: async (sessionId) => {
    const s = MOCK_DB.workSessions.find(x=>x.id===sessionId);
    s.checkOut = nowISO(); s.status='done';
    const pts = MOCK_DB.gpsTracking.filter(g=>g.sessionId===sessionId).map(g=>({lat:g.latitude,lng:g.longitude}));
    s.totalDistance = +routeDistanceKm(pts).toFixed(1);

    await delay(300);
    return {...s};

    issue: {c:'badge-warn', t:'GPS Bermasalah'},
    done: {c:'badge-off', t:'Selesai'},
    idle: {c:'badge-off', t:'Belum Mulai'},
    offline: {c:'badge-off', t:'Offline'},
  };
  const s = map[status]||map.idle;
  return `<span class="badge ${s.c}"><span class="dot"></span>${s.t}</span>`;
}

function renderGpsBanner(){
  const slot = document.getElementById('gps-banner-slot');
  if(!slot) return;
  const st = STATE.work.gpsState;
  if(!STATE.work.session){ slot.innerHTML=''; return; }
  const banners = {
    idle: {c:'warn', h:'Menunggu sinyal GPS', b:'Mengambil lokasi perangkat…'},
    active: {c:'ok', h:'GPS Aktif', b:`Lokasi sedang direkam · akurasi ±${STATE.work.lastFix?.accuracy?.toFixed(0)||'–'}m · update ${STATE.work.lastFix?fmtTime(STATE.work.lastFix.t):'–'}`},
    weak: {c:'warn', h:'GPS Lemah', b:'Akurasi lokasi rendah, coba pindah ke area terbuka.'},
    denied: {c:'err', h:'Izin lokasi ditolak', b:'Permission lokasi diperlukan agar sistem dapat mencatat perjalanan Anda.'},
    unavailable: {c:'err', h:'GPS Tidak Aktif', b:'Aktifkan lokasi untuk melanjutkan tracking.'},
    offline_queue: {c:'warn', h:'Koneksi terputus', b:`${STATE.work.syncQueue.length} titik lokasi disimpan sementara, akan disinkronkan otomatis.`},
  };
  const b = banners[st] || banners.idle;
  slot.innerHTML = `<div class="gps-banner ${b.c}"><span>${ICON.gps}</span><div><b>${b.h}</b>${b.b}</div></div>`;
}

async function handleStartWork(){
  if(!navigator.geolocation){ toast('Perangkat tidak mendukung Geolocation API.', 'err'); return; }
  const btn = document.getElementById('btn-start'); if(btn){btn.disabled=true; btn.textContent='Mengambil lokasi…';}
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const p = {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy};
    const session = await api.startWork(STATE.user.id, p);
    STATE.work.session = session;
    STATE.work.points = [p];
    STATE.work.gpsState = pos.coords.accuracy>50 ? 'weak' : 'active';
    STATE.work.lastFix = {...p, t:Date.now()};
    startWatch();
    toast('Berhasil check-in. GPS aktif.', 'ok');
    renderPage();
  }, (err)=>{
    if(btn){btn.disabled=false; btn.textContent='MULAI KERJA';}
    if(err.code===1){ STATE.work.gpsState='denied'; toast('Permission lokasi diperlukan agar sistem dapat mencatat perjalanan Anda.','err'); }
    else if(err.code===2){ STATE.work.gpsState='unavailable'; toast('GPS tidak tersedia di perangkat ini.','err'); }
    else { toast('Gagal mengambil lokasi. Coba lagi.','err'); }
    renderGpsBanner();
  }, {enableHighAccuracy:true, timeout:10000});
}

function startWatch(){
  if(STATE.work.watchId!=null) navigator.geolocation.clearWatch(STATE.work.watchId);
  let lastSaved = 0;
  STATE.work.watchId = navigator.geolocation.watchPosition(async (pos)=>{
    const p = {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy};
    STATE.work.points.push(p);
    STATE.work.lastFix = {...p, t:Date.now()};
    STATE.work.gpsState = pos.coords.accuracy>50 ? 'weak' : 'active';
    // Titik dengan akurasi lebih buruk dari ambang yang diatur admin tidak disimpan ke rute
    const accuracyOk = pos.coords.accuracy==null || pos.coords.accuracy<=APP_SETTINGS.accuracyThreshold;
    const now = Date.now();
    const throttleOk = now - lastSaved > APP_SETTINGS.gpsIntervalSec*1000;
    if(STATE.work.session && accuracyOk && throttleOk){
      lastSaved = now;
      if(navigator.onLine===false){
        STATE.work.syncQueue.push(p);
        STATE.work.gpsState='offline_queue';
      } else {
        if(STATE.work.syncQueue.length){
          for(const qp of STATE.work.syncQueue){ await api.pushLocation(STATE.work.session.id, STATE.user.id, qp); }
          STATE.work.syncQueue = [];
        }
        await api.pushLocation(STATE.work.session.id, STATE.user.id, p);
      }
    }
    renderGpsBanner();
    const dEl = document.querySelector('.s-value.mono'); if(dEl) dEl.innerHTML = routeDistanceKm(STATE.work.points).toFixed(1)+'<small>km</small>';
  }, (err)=>{
    if(err.code===1) STATE.work.gpsState='denied';
    else if(err.code===2) STATE.work.gpsState='unavailable';
    renderGpsBanner();
  }, {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
}

function handleStopWork(){
  openModal({
    title:'Selesai Kerja?',
    body:'Sesi kerja dan tracking GPS akan dihentikan. Pastikan seluruh kunjungan hari ini sudah dicatat.',
    confirmText:'Ya, Selesai Kerja', confirmClass:'btn-danger',
    onConfirm: async ()=>{
      if(STATE.work.watchId!=null){ navigator.geolocation.clearWatch(STATE.work.watchId); STATE.work.watchId=null; }
      const s = await api.stopWork(STATE.work.session.id);
      STATE.work.session = null; STATE.work.gpsState='idle'; STATE.work.points=[];
      toast(`Check-out berhasil. Total jarak ${s.totalDistance} km.`, 'ok');
      renderPage();
    }
  });
}

async function pageMyMap(root){

  const route = refSession ? (session ? STATE.work.points.length?STATE.work.points:(await api.getRoute(refSession.id)).map(g=>({lat:g.latitude,lng:g.longitude})) : (await api.getRoute(refSession.id)).map(g=>({lat:g.latitude,lng:g.longitude}))) : [];

      <p class="page-eyebrow">Peta Saya</p>
      <h1 class="page-title">Rute Perjalanan</h1>
      <p class="page-sub">${refSession? (session?'Sesi aktif · live tracking':'Sesi terakhir · '+fmtDate(refSession.checkIn)) : 'Belum ada data perjalanan'}</p>
    </div>
    ${refSession ? `<div id="mymap-el" class="leaflet-map" style="height:440px;"></div>
    <div class="map-legend">
      <span><i style="background:#2563EB"></i>Posisi Sales</span>
      <span><i style="background:#16A34A"></i>Titik Check-in</span>
      <span><i style="background:#EA580C"></i>Kunjungan Pelanggan</span>
      <span><i style="background:#DC2626"></i>Titik Check-out</span>
    </div>` : emptyState('🗺️','Belum ada rute','Mulai kerja untuk merekam rute perjalanan Anda.')}
  `;
  if(refSession){
    const map = L.map('mymap-el', {zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'}).addTo(map);
    const bounds = [];
    if(route.length){
      L.polyline(route.map(p=>[p.lat,p.lng]), {color:'#2563EB', weight:4, opacity:.85, dashArray:'1,9', lineCap:'round'}).addTo(map);
      route.forEach(p=>bounds.push([p.lat,p.lng]));
      L.circleMarker([route[0].lat,route[0].lng], {radius:7, color:'#16A34A', fillColor:'#16A34A', fillOpacity:1}).addTo(map).bindPopup('Titik Check-in');
      const last = route[route.length-1];
      L.circleMarker([last.lat,last.lng], {radius:8, color:'#2563EB', fillColor:'#2563EB', fillOpacity:1}).addTo(map).bindPopup(session?'Posisi saat ini':'Posisi terakhir');

        L.circleMarker([last.lat,last.lng], {radius:5, color:'#DC2626', fillColor:'#DC2626', fillOpacity:1}).addTo(map).bindPopup('Titik Check-out');
      }
    }
    visits.forEach(v=>{
      L.circleMarker([v.latitude,v.longitude], {radius:7, color:'#EA580C', fillColor:'#EA580C', fillOpacity:1}).addTo(map).bindPopup(`<b>${escapeHtml(v.customerName)}</b><br>${escapeHtml(v.address)}`);
      bounds.push([v.latitude,v.longitude]);
    });
    if(bounds.length) map.fitBounds(bounds, {padding:[30,30]}); else map.setView([CENTER.lat,CENTER.lng], 12);
  }
}

// Peringatan otomatis di Dashboard Admin — dicek ulang tiap kali dashboard
// dimuat/di-refresh. Dua kondisi yang dipantau:
// 1) Sales aktif yang belum check-in sama sekali padahal sudah lewat jam 9 pagi
// 2) Sales berstatus "Sedang Bekerja" tapi GPS-nya belum update >30 menit
function buildDashboardAlerts(sales, sessions){
  const alerts = [];
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const hour = now.getHours();

  if(hour>=9){
    sales.filter(s=>s.status==='active').forEach(s=>{
      const checkedInToday = sessions.some(sess=>sess.salesId===s.id && sess.date===today);
      if(!checkedInToday) alerts.push(`🟡 <b>${escapeHtml(s.name)}</b> belum check-in hari ini (sudah lewat jam 9 pagi)`);
    });
  }

  sales.forEach(s=>{
    const ls = lastSession(sessions, s.id);
    if(!ls || liveStatusOf(ls)!=='working') return;
    const pts = MOCK_DB.gpsTracking.filter(g=>g.sessionId===ls.id).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
    const lastPing = pts.length ? new Date(pts[pts.length-1].timestamp) : new Date(ls.checkIn);
    const minutesSince = (now - lastPing) / 60000;
    if(minutesSince > 30) alerts.push(`🔴 GPS <b>${escapeHtml(s.name)}</b> belum update selama ${Math.floor(minutesSince)} menit (status masih "Sedang Bekerja")`);
  });

  return alerts;
}

function lastSession(sessions, salesId){
  const arr = sessions.filter(s=>s.salesId===salesId).sort((a,b)=>new Date(b.checkIn)-new Date(a.checkIn));
  return arr[0];
}
// Status kerja sales yang SEBENARNYA — diambil dari field session.status asli
// ('working' | 'issue' | 'done'), bukan dari data demo lama yang sudah dihapus.
function liveStatusOf(session){
  return session ? (session.status || 'offline') : 'offline';
}
// Posisi GPS terakhir sales, diambil dari titik gpsTracking terbaru pada sesi
// kerja tsb (data GPS asli, bukan posisi acak demo).
function livePosOf(session){
  if(!session) return null;
  const pts = MOCK_DB.gpsTracking.filter(g=>g.sessionId===session.id).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  return pts.length ? {lat:pts[pts.length-1].latitude, lng:pts[pts.length-1].longitude} : null;
}
function salesMiniCard(s, sessions){
  const ls = lastSession(sessions, s.id);
  return `<div class="card card-pad" data-sales="${s.id}" style="cursor:pointer;">
    <div class="hstack"><div class="avatar">${initials(s.name)}</div><div style="min-width:0;"><div style="font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(s.name)}</div><div style="font-size:11px; color:var(--slate-500);">Update baru saja</div></div></div>
    <div style="margin-top:10px;">${statusBadge(liveStatusOf(ls)==='issue'?'issue':'working')}</div>
  </div>`;
}

let liveMap=null, liveMarkers={};
async function pageLiveMonitoring(root){
  const sales = await api.getAllSales();
  const sessions = await api.getAllSessions();

  // Kalau peta udah pernah dibuat dan elemennya masih ada di layar (berarti
  // ini refresh berkala, bukan navigasi baru ke halaman ini), jangan bikin
  // peta baru lagi — biar posisi zoom/geser yang lagi dilihat admin nggak
  // ke-reset tiap 15 detik. Cukup update titik-titik marker-nya aja.
  const alreadyMounted = liveMap && document.getElementById('live-map-el');
  if(!alreadyMounted){
    root.innerHTML = `
      <div class="page-head"><p class="page-eyebrow">Live Monitoring</p><h1 class="page-title">Live Monitoring</h1><p class="page-sub">Posisi seluruh sales, diperbarui berkala</p></div>
      <div style="display:grid; grid-template-columns:2fr 1fr; gap:16px; align-items:start;" id="live-grid">
        <div>
          <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" id="live-search" placeholder="Cari daerah/alamat, mis. Cikijing" style="flex:1;" />
            <button class="btn btn-secondary" id="live-search-btn">Cari</button>
          </div>
          <div id="live-map-el" class="leaflet-map" style="height:490px;"></div>
        </div>
        <div class="card card-pad" style="max-height:520px; overflow-y:auto;">
          <b style="font-size:13px;">Status Sales</b>
          <div style="margin-top:10px;" id="live-list"></div>
        </div>
      </div>
    `;
    const grid = document.getElementById('live-grid');
    if(window.innerWidth<880){ grid.style.gridTemplateColumns='1fr'; }
    liveMap = L.map('live-map-el');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(liveMap);
    liveMarkers = {};
    bindLiveSearch();
  }

  const bounds=[];
  const listEl = document.getElementById('live-list');
  listEl.innerHTML='';
  sales.forEach(s=>{
    const ls = lastSession(sessions, s.id);
    const pos = livePosOf(ls) || CENTER;
    const st = liveStatusOf(ls);
    const color = st==='working' ? '#16A34A' : st==='issue' ? '#CA8A04' : '#94A3B8';
    const popupHtml = `<b>${escapeHtml(s.name)}</b><br>${st==='working'?'🟢 Sedang bekerja':(st==='issue'?'🟡 GPS bermasalah':'⚪ Offline')}<br>Update baru saja`;
    let marker = liveMarkers[s.id];
    if(marker){
      marker.setLatLng([pos.lat,pos.lng]);
      marker.setStyle({color, fillColor:color});
      marker.setPopupContent(popupHtml);
    } else {
      marker = L.circleMarker([pos.lat,pos.lng], {radius:9, color, fillColor:color, fillOpacity:.9, weight:2}).addTo(liveMap);
      marker.bindPopup(popupHtml);
      marker.on('click', ()=>{ STATE.detailSalesId=s.id; STATE.page='salesdetail'; render(); });
      liveMarkers[s.id]=marker;
    }
    bounds.push([pos.lat,pos.lng]);

    const row = document.createElement('div');
    row.className='visit-card'; row.style.cursor='pointer';
    row.innerHTML = `<div class="spread"><div class="v-name" style="font-size:13px;">${escapeHtml(s.name)}</div>${statusBadge(st)}</div><div class="v-meta">Update baru saja</div>`;
    row.onclick=()=>{ liveMap.setView([pos.lat,pos.lng], 14); marker.openPopup(); };
    listEl.appendChild(row);
  });
  // fitBounds cuma dipanggil sekali di awal (bukan tiap refresh), biar nggak
  // maksa peta zoom-out ulang tiap kali admin lagi zoom-in lihat satu titik.
  if(!alreadyMounted && bounds.length) liveMap.fitBounds(bounds, {padding:[30,30]});
}

let liveSearchMarker = null;
function bindLiveSearch(){
  const input = document.getElementById('live-search');
  const btn = document.getElementById('live-search-btn');
  if(!input || !btn) return;
  const run = ()=>searchLiveArea();
  btn.onclick = run;
  input.onkeydown = (e)=>{ if(e.key==='Enter') run(); };
}
async function searchLiveArea(){
  const input = document.getElementById('live-search');
  const btn = document.getElementById('live-search-btn');
  const q = input.value.trim();
  if(!q) return;
  btn.disabled = true; const original = btn.textContent; btn.textContent = 'Mencari…';
  try{
    // Nominatim (OpenStreetMap) — layanan pencarian lokasi gratis, tanpa API key.
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(data && data[0]){
      const lat=+data[0].lat, lng=+data[0].lon;
      liveMap.setView([lat,lng], 14);
      if(liveSearchMarker) liveMap.removeLayer(liveSearchMarker);
      liveSearchMarker = L.marker([lat,lng]).addTo(liveMap).bindPopup(`📍 ${escapeHtml(data[0].display_name)}`).openPopup();
    } else {
      toast('Daerah/alamat tidak ditemukan. Coba kata kunci lain.', 'err');
    }
  }catch(e){
    toast('Gagal mencari daerah. Cek koneksi internet.', 'err');
  }
  btn.disabled = false; btn.textContent = original;
}

function timelineHtml(session, visits){
  if(!session) return `<div style="font-size:12.5px;color:var(--slate-500);">Belum ada aktivitas.</div>`;
  const events = [{t:session.checkIn, label:'Check-in'}];
  visits.forEach(v=>events.push({t:v.visitedAt, label:'Kunjungan '+v.customerName}));
  if(session.checkOut) events.push({t:session.checkOut, label:'Check-out'});
  events.sort((a,b)=>new Date(a.t)-new Date(b.t));
  return events.map(e=>`<div class="t-item"><div class="t-time">${fmtTime(e.t)}</div><div class="t-label">${escapeHtml(e.label)}</div></div>`).join('');
}

      const data = {name, username, phone:document.getElementById('sf-phone').value.trim(), status:document.getElementById('sf-status').value};
      if(existing){ await api.updateSales(existing.id, data); toast('Data sales diperbarui.','ok'); }
      else { data.password = await hashPassword(document.getElementById('sf-password').value || 'sales123'); await api.addSales(data); toast('Sales baru ditambahkan.','ok'); }
      pageManage(root);
    }
  });
}

/* =====================================================================
   ADMIN: LAPORAN
   ===================================================================== */
async function pageReports(root){
  const sales = await api.getAllSales();
  const sessions = await api.getAllSessions();
  root.innerHTML = `
    <div class="page-head"><p class="page-eyebrow">Laporan</p><h1 class="page-title">Laporan Aktivitas</h1></div>
    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end;">
        <div class="field" style="margin:0;"><label>Sales</label><select id="rp-sales"><option value="all">Semua Sales</option>${sales.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
        <div class="field" style="margin:0;"><label>Tanggal mulai</label><input type="date" id="rp-from" /></div>
        <div class="field" style="margin:0;"><label>Tanggal akhir</label><input type="date" id="rp-to" /></div>
        <div class="field" style="margin:0;"><label>Status</label><select id="rp-status"><option value="all">Semua</option><option value="working">Sedang bekerja</option><option value="done">Selesai</option><option value="issue">Bermasalah</option></select></div>
        <button class="btn btn-primary" id="rp-apply">Terapkan Filter</button>
      </div>
    </div>
    <div class="grid grid-stats" style="margin-bottom:16px;" id="rp-summary"></div>
    <div class="spread" style="margin-bottom:10px;">
      <b style="font-size:13.5px;">Detail Laporan</b>
      <div class="hstack"><button class="btn btn-ghost btn-sm" id="rp-csv">⬇ Export CSV</button><button class="btn btn-ghost btn-sm" id="rp-excel">⬇ Export Excel</button><button class="btn btn-ghost btn-sm" id="rp-print">🖶 Print / PDF</button></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Sales</th><th>Check-in</th><th>Check-out</th><th>Durasi</th><th>Kunjungan</th><th>Jarak</th><th>Status</th></tr></thead>
      <tbody id="rp-body"></tbody>
    </table></div>
  `;
  function computeRows(){
    const salesId = document.getElementById('rp-sales').value;
    const from = document.getElementById('rp-from').value;
    const to = document.getElementById('rp-to').value;
    const status = document.getElementById('rp-status').value;
    return sessions.filter(s=>{
      if(salesId!=='all' && s.salesId!==salesId) return false;
      if(from && s.date<from) return false;
      if(to && s.date>to) return false;
      const st = s.status==='working'?'working':(s.status==='issue'?'issue':'done');
      if(status!=='all' && st!==status) return false;
      return true;
    }).sort((a,b)=>new Date(b.checkIn)-new Date(a.checkIn));
  }
  function draw(){
    const rows = computeRows();
    const totalDays = new Set(rows.map(r=>r.date+r.salesId)).size;
    const totalVisits = rows.reduce((a,r)=>a+MOCK_DB.customerVisits.filter(v=>v.sessionId===r.id).length,0);
    const totalDist = rows.reduce((a,r)=>a+(r.totalDistance||0),0);
    const totalJam = rows.reduce((a,r)=>a+((r.checkOut?new Date(r.checkOut):new Date())-new Date(r.checkIn)),0);
    document.getElementById('rp-summary').innerHTML = `
      <div class="stat-card card"><div class="s-label">Total Hari Kerja</div><div class="s-value">${totalDays}</div></div>
      <div class="stat-card card"><div class="s-label">Total Kunjungan</div><div class="s-value">${totalVisits}</div></div>
      <div class="stat-card card"><div class="s-label">Total Jarak</div><div class="s-value mono">${totalDist.toFixed(1)}<small>km</small></div></div>
      <div class="stat-card card"><div class="s-label">Total Jam Kerja</div><div class="s-value mono">${fmtDuration(totalJam)}</div></div>
    `;
    document.getElementById('rp-body').innerHTML = rows.length ? rows.map(r=>{
      const s = sales.find(x=>x.id===r.salesId);
      const visits = MOCK_DB.customerVisits.filter(v=>v.sessionId===r.id).length;
      const dur = (r.checkOut?new Date(r.checkOut):new Date())-new Date(r.checkIn);
      const st = r.status==='working'?'working':(r.status==='issue'?'issue':'done');
      return `<tr><td class="mono">${fmtDateShort(r.checkIn)}</td><td>${escapeHtml(s?.name||'—')}</td><td class="mono">${fmtTime(r.checkIn)}</td><td class="mono">${r.checkOut?fmtTime(r.checkOut):'—'}</td><td class="mono">${fmtDuration(dur)}</td><td class="mono">${visits}</td><td class="mono">${r.totalDistance} km</td><td>${statusBadge(st)}</td></tr>`;
    }).join('') : `<tr><td colspan="8">${emptyState('📄','Tidak ada data','Ubah filter tanggal, sales, atau status.')}</td></tr>`;
  }
  draw();
  document.getElementById('rp-apply').onclick = draw;
  document.getElementById('rp-csv').onclick = ()=>{
    const rows = computeRows();
    let csv = 'Tanggal,Sales,Check-in,Check-out,Durasi(menit),Kunjungan,Jarak(km),Status\n';
    rows.forEach(r=>{
      const s = sales.find(x=>x.id===r.salesId);
      const visits = MOCK_DB.customerVisits.filter(v=>v.sessionId===r.id).length;
      const durMin = Math.round(((r.checkOut?new Date(r.checkOut):new Date())-new Date(r.checkIn))/60000);
      csv += `${r.date},${(s?.name||'').replace(/,/g,' ')},${fmtTime(r.checkIn)},${r.checkOut?fmtTime(r.checkOut):''},${durMin},${visits},${r.totalDistance},${r.status}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'laporan-jejak.csv'; a.click();
    toast('Laporan CSV diunduh.','ok');
  };
  document.getElementById('rp-print').onclick = ()=>window.print();
  document.getElementById('rp-excel').onclick = ()=>{
    const rows = computeRows();
    let html = '<table border="1"><tr><th>Tanggal</th><th>Sales</th><th>Check-in</th><th>Check-out</th><th>Durasi(menit)</th><th>Kunjungan</th><th>Jarak(km)</th><th>Status</th></tr>';
    rows.forEach(r=>{
      const s = sales.find(x=>x.id===r.salesId);
      const visits = MOCK_DB.customerVisits.filter(v=>v.sessionId===r.id).length;
      const durMin = Math.round(((r.checkOut?new Date(r.checkOut):new Date())-new Date(r.checkIn))/60000);
      html += `<tr><td>${r.date}</td><td>${escapeHtml(s?.name||'')}</td><td>${fmtTime(r.checkIn)}</td><td>${r.checkOut?fmtTime(r.checkOut):''}</td><td>${durMin}</td><td>${visits}</td><td>${r.totalDistance}</td><td>${r.status}</td></tr>`;
    });
    html += '</table>';
    const blob = new Blob([html], {type:'application/vnd.ms-excel'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'laporan-jejak.xls'; a.click();
    toast('Laporan Excel diunduh.','ok');
  };
}

        </select>
      </div>

/* ---------------------------- SHARED UI HELPERS ---------------------------- */
function emptyState(icon,title,sub){
  return `<div class="empty-state"><div class="e-ic">${icon}</div><div class="e-title">${escapeHtml(title)}</div>${sub?`<div class="e-sub">${escapeHtml(sub)}</div>`:''}</div>`;
}

/* ---------------------------- MODAL SYSTEM ---------------------------- */
function openModal(opts){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" style="${opts.wide?'max-width:520px;':''}">
        <div class="modal-head"><h3>${escapeHtml(opts.title)}</h3></div>
        ${opts.body ? `<div class="modal-body">${opts.body}</div>` : ''}
        ${opts.bodyHtmlBeforeMap ? `<div class="modal-body">${opts.bodyHtmlBeforeMap}</div>` : ''}
        ${opts.formHtml ? `<div class="modal-form">${opts.formHtml}</div>` : ''}
        <div class="modal-foot">
          ${opts.hideCancel? '' : `<button class="btn btn-ghost" id="modal-cancel">Batal</button>`}
          <button class="btn ${opts.confirmClass||'btn-primary'}" id="modal-confirm">${escapeHtml(opts.confirmText||'OK')}</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modal-backdrop').onclick = (e)=>{ if(e.target.id==='modal-backdrop') close(); };
  const cancelBtn = document.getElementById('modal-cancel'); if(cancelBtn) cancelBtn.onclick = close;
  document.getElementById('modal-confirm').onclick = async (e)=>{
    const btn = e.currentTarget; const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Memproses…';
    try{
      const result = await opts.onConfirm();
      if(result === false){ btn.disabled=false; btn.textContent=orig; return; }
      close();
    }catch(err){ console.error(err); toast('Terjadi kesalahan.','err'); btn.disabled=false; btn.textContent=orig; }
  };
  if(opts.onOpen) setTimeout(opts.onOpen, 30);
}

/* ---------------------------- BOOT ---------------------------- */
(async function boot(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
  await firebaseReady;
  await loadSettings();
  await loadOrSeedDatabase();
  // Pulihkan sesi login kalau sebelumnya sudah login di browser ini (biar F5
  // atau buka tab baru tidak perlu login ulang) — sesi tersimpan di
  // localStorage (lokal di browser itu saja, bukan di database).
  try{
    const saved = JSON.parse(localStorage.getItem('jejak_session') || 'null');
    if(saved && saved.userId){
      const u = MOCK_DB.users.find(x=>x.id===saved.userId);
      if(u && u.status==='active'){ STATE.user = u; STATE.page = 'dashboard'; }
      else localStorage.removeItem('jejak_session');
    }
  }catch(e){ localStorage.removeItem('jejak_session'); }
  render();
})();
</script>
